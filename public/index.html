<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Localize - Tes Dashboard Data Backend</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">👟 Localize Backend Tester UI</a>
      <span class="badge bg-success">Status: Online</span>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Nav Tabs -->
    <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="tab-products" data-bs-toggle="pill" data-bs-target="#content-products" type="button">
          📦 Katalog Sepatu (Turso)
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-create-order" data-bs-toggle="pill" data-bs-target="#content-create-order" type="button">
          🛒 Uji Buat Pesanan (+ Live GPS)
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-admin-orders" data-bs-toggle="pill" data-bs-target="#content-admin-orders" type="button">
          📊 Rekap Pesanan Admin (GPS Location)
        </button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      <!-- 1. TAB KATALOG SEPATU -->
      <div class="tab-pane fade show active" id="content-products">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>Daftar Sepatu di Database Turso</h4>
          <button class="btn btn-outline-primary btn-sm" onclick="loadProducts()">🔄 Refresh Data</button>
        </div>
        <div id="products-list" class="row g-3">
          <div class="col-12 text-muted">Memuat data sepatu...</div>
        </div>
      </div>

      <!-- 2. TAB UJI BUAT PESANAN -->
      <div class="tab-pane fade" id="content-create-order">
        <div class="card card-body shadow-sm max-w-600">
          <h4>Simulasi Transaksi Checkout Pelanggan</h4>
          <form id="orderForm" onsubmit="submitOrder(event)">
            <div class="mb-3">
              <label class="form-label">User ID Pelanggan</label>
              <input type="number" id="userId" class="form-value form-control" value="1" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Pilih Produk Sepatu</label>
              <select id="productId" class="form-select" required>
                <!-- Populated dynamically -->
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Alamat Pengiriman Ringkas</label>
              <input type="text" id="shippingAddress" class="form-control" value="Jl. Sudirman No. 123, Jakarta" required />
            </div>

            <!-- Bagian GPS -->
            <div class="p-3 mb-3 border rounded bg-white">
              <label class="form-label fw-bold">📍 Koordinat Lokasi Rumah (GPS Device)</label>
              <div class="row g-2 mb-2">
                <div class="col">
                  <input type="number" step="any" id="latitude" class="form-control" placeholder="Latitude" required />
                </div>
                <div class="col">
                  <input type="number" step="any" id="longitude" class="form-control" placeholder="Longitude" required />
                </div>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" onclick="getGPSLocation()">
                📡 Dapatkan Lokasi GPS Saya Saat Ini
              </button>
            </div>

            <button type="submit" class="btn btn-success w-100">Kirim Pesanan ke Backend</button>
          </form>
          <div id="orderResult" class="mt-3"></div>
        </div>
      </div>

      <!-- 3. TAB ADMIN ORDERS -->
      <div class="tab-pane fade" id="content-admin-orders">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4>Data Transaksi Masuk (Tampilan Admin)</h4>
          <button class="btn btn-outline-primary btn-sm" onclick="loadAdminOrders()">🔄 Refresh Pesanan</button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-striped bg-white shadow-sm">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Pelanggan</th>
                <th>Telepon</th>
                <th>Total</th>
                <th>Alamat</th>
                <th>Koordinat GPS</th>
                <th>Peta</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="orders-table-body">
              <tr><td colspan="8" class="text-center text-muted">Klik Refresh Pesanan...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let productsData = [];

    // Load Products dari Express -> Turso
    async function loadProducts() {
      const container = document.getElementById("products-list");
      const selectProduct = document.getElementById("productId");
      container.innerHTML = '<div class="col-12 text-muted">Memuat data...</div>';

      try {
        const res = await fetch("/api/products");
        const json = await res.json();

        if (json.success) {
          productsData = json.data;
          container.innerHTML = "";
          selectProduct.innerHTML = "";

          if (productsData.length === 0) {
            container.innerHTML = '<div class="col-12 alert alert-warning">Database Turso masih kosong. Jalankan <code>npm run seed</code> dahulu!</div>';
            return;
          }

          productsData.forEach(p => {
            // Render Cards Produk
            container.innerHTML += `
              <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                  <img src="${p.image_url || 'https://via.placeholder.com/300'}" class="card-img-top" style="height:180px; object-fit:cover;">
                  <div class="card-body">
                    <h5 class="card-title">${p.name}</h5>
                    <p class="card-text text-muted small">${p.description}</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                      <span class="fw-bold text-success">Rp ${Number(p.price).toLocaleString('id-ID')}</span>
                      <span class="badge bg-secondary">Stok: ${p.stock}</span>
                    </div>
                  </div>
                </div>
              </div>
            `;

            // Render Select Option
            selectProduct.innerHTML += `<option value="${p.id}">${p.name} - Rp ${Number(p.price).toLocaleString('id-ID')}</option>`;
          });
        }
      } catch (err) {
        container.innerHTML = `<div class="col-12 alert alert-danger">Error: ${err.message}</div>`;
      }
    }

    // Tangkap Lokasi GPS Browser Asli
    function getGPSLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            document.getElementById("latitude").value = pos.coords.latitude;
            document.getElementById("longitude").value = pos.coords.longitude;
            alert("✅ Lokasi GPS berhasil ditangkap!");
          },
          (err) => {
            alert("❌ Gagal mengambil lokasi GPS: " + err.message);
          }
        );
      } else {
        alert("Browser Anda tidak mendukung Geolocation GPS.");
      }
    }

    // Submit Order Baru
    async function submitOrder(e) {
      e.preventDefault();
      const resultDiv = document.getElementById("orderResult");
      resultDiv.innerHTML = '<div class="alert alert-info">Mengirim pesanan...</div>';

      const selectedProductId = parseInt(document.getElementById("productId").value);
      const selectedProduct = productsData.find(p => p.id === selectedProductId);

      const payload = {
        userId: parseInt(document.getElementById("userId").value),
        totalAmount: selectedProduct ? selectedProduct.price : 100000,
        shippingAddress: document.getElementById("shippingAddress").value,
        latitude: parseFloat(document.getElementById("latitude").value),
        longitude: parseFloat(document.getElementById("longitude").value),
        items: [
          {
            productId: selectedProductId,
            quantity: 1,
            price: selectedProduct ? selectedProduct.price : 100000
          }
        ]
      };

      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.success) {
          resultDiv.innerHTML = `<div class="alert alert-success">✅ ${json.message} (Order ID: ${json.orderId})</div>`;
        } else {
          resultDiv.innerHTML = `<div class="alert alert-danger">❌ ${json.message}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${err.message}</div>`;
      }
    }

    // Load Rekap Order untuk Tampilan Admin
    async function loadAdminOrders() {
      const tbody = document.getElementById("orders-table-body");
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Memuat pesanan...</td></tr>';

      try {
        const res = await fetch("/api/orders/admin");
        const json = await res.json();

        if (json.success) {
          tbody.innerHTML = "";
          if (json.data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Belum ada transaksi di database.</td></tr>';
            return;
          }

          json.data.forEach(o => {
            const googleMapsUrl = `https://www.google.com/maps?q=${o.latitude},${o.longitude}`;
            tbody.innerHTML += `
              <tr>
                <td>#${o.order_id}</td>
                <td>${o.customer_name}</td>
                <td>${o.phone_number}</td>
                <td>Rp ${Number(o.total_amount).toLocaleString('id-ID')}</td>
                <td>${o.shipping_address}</td>
                <td><small>${o.latitude}, ${o.longitude}</small></td>
                <td>
                  <a href="${googleMapsUrl}" target="_blank" class="btn btn-sm btn-outline-danger">
                    🗺️ Google Maps
                  </a>
                </td>
                <td><span class="badge bg-warning text-dark">${o.status}</span></td>
              </tr>
            `;
          });
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center">Error: ${err.message}</td></tr>`;
      }
    }

    // Inisialisasi awal
    loadProducts();
  </script>
</body>
</html>
